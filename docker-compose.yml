services:

  db:
    image: postgres:17
    container_name: medicarte_db
    environment:
      POSTGRES_DB: MedicArte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Erkenenpostgres23
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MedicArte"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: